services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./certs:/app/certs
      - ./vault:/app/vault

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
    depends_on: [api]
